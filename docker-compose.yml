version: "3.9"

services:
  gateway:
    build: ./gateway
    depends_on:
    - postgres
    - rabbitmq
    - rustfs
    - redis
    container_name: gateway
    ports:
      - "3000:3000"
    env_file:
      - ./gateway/.env
    volumes:
      - ./gateway:/app
      - /app/node_modules

  auth-service:
    build: ./auth-service
    depends_on:
    - postgres
    - rabbitmq
    - rustfs
    - redis
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env
    volumes:
      - ./auth-service:/app
      - /app/node_modules

  project-service:
    build: ./project-service
    depends_on:
    - postgres
    - rabbitmq
    - rustfs
    - redis
    container_name: project-service
    ports:
      - "3002:3002"
    env_file:
      - ./project-service/.env
    volumes:
      - ./project-service:/app
      - /app/node_modules

  task-service:
    build: ./task-service
    depends_on:
    - postgres
    - rabbitmq
    - rustfs
    - redis
    container_name: task-service
    ports:
      - "3003:3003"
    env_file:
      - ./task-service/.env
    volumes:
      - ./task-service:/app
      - /app/node_modules

  file-service:
    build: ./file-service
    depends_on:
    - postgres
    - rabbitmq
    - rustfs
    - redis
    container_name: file-service
    ports:
      - "3005:3005"
    env_file:
      - ./file-service/.env
    volumes:
      - ./file-service:/app
      - /app/node_modules

  notification-service:
    build: ./notification-service
    depends_on:
    - postgres
    - rabbitmq
    - rustfs
    - redis
    container_name: notification-service
    ports:
      - "3004:3004"
    env_file:
      - ./notification-service/.env
    volumes:
      - ./notification-service:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    depends_on:
    - auth-service
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:

    image: postgres:17

    container_name: postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:

      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:

    image: redis:7-alpine

    container_name: redis

    restart: always

    ports:

      - "6379:6379"

  rabbitmq:

    image: rabbitmq:4-management

    container_name: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    restart: always

    ports:

      - "5672:5672"

      - "15672:15672"

  rustfs:

    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped

    command: /data

    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - rustfs_data:/data

volumes:

  postgres_data:

  rustfs_data:

