name: Docker Build and Push
description: Build and publish service Docker images to GHCR

inputs:
  service:
    description: Service directory name
    required: true

  registry:
    description: Container registry
    required: false
    default: ghcr.io

  image-prefix:
    description: Docker image name prefix
    required: false
    default: task-management

runs:
  using: composite
  steps:
    - name: Generate Image Name
      id: image-name
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        OWNER: ${{ github.repository_owner }}
        PREFIX: ${{ inputs.image-prefix }}
        SERVICE: ${{ inputs.service }}
      run: |
        OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
        IMAGE="${REGISTRY}/${OWNER}/${PREFIX}-${SERVICE}"

        echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract Docker Metadata
      id: metadata
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image-name.outputs.image }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=short
          type=ref,event=tag

    - name: Build and Push Image
      uses: docker/build-push-action@v6
      with:
        context: ./${{ inputs.service }}
        file: ./${{ inputs.service }}/Dockerfile
        target: production
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,mode=max,scope=${{ inputs.service }}
        